<!DOCTYPE html>
<!-- translate="no": the wallet UI must never be auto-translated. Chrome/Opera page translation
     moves DOM text nodes, and React's commit phase then throws NotFoundError on removeChild
     (EXTENSION-WALLET-4GT) — besides translating amounts/addresses being unsafe on its own. -->
<html translate="no" style="width: 375px; height: 572px">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Trust Wallet</title>
    <style>
      @keyframes tw-initial-spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
      #initial-loader {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        z-index: 2147483647;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #ffffff;
        opacity: 1;
        transition: opacity 400ms ease-in-out;
      }
      #initial-loader.tw-initial-loader--hidden {
        opacity: 0;
        pointer-events: none;
      }
      .tw-initial-loader__spinner {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        border: 3px solid rgba(37,37,37,0.23922);
        border-top: 3px solid #0500ff;
        animation: tw-initial-spin 1s linear infinite;
      }
      @media (prefers-color-scheme: dark) {
        #initial-loader {
          background-color: #1b1b1c;
        }
        .tw-initial-loader__spinner {
          border-color: rgba(234,236,239,0.23922);
          border-top-color: #48ff91;
        }
      }
    </style>
    <script type="module" crossorigin src="/chunks/sidepanel-B6OvTS7w.js"></script>
    <link rel="modulepreload" crossorigin href="/chunks/preload-helper-it2FuLOP.js">
    <link rel="modulepreload" crossorigin href="/chunks/logger-f-bHRdRH.js">
    <link rel="modulepreload" crossorigin href="/chunks/constants-Dhnmi6Ui.js">
  </head>
  <body style="width: 375px; height: 572px; margin: 0">
    <div id="initial-loader">
      <div class="tw-initial-loader__spinner"></div>
    </div>
    <div id="root" data-id="root"></div>
  </body>
</html>
